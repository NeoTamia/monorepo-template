name: Project Setup

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    name: Setup Project
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if already initialized
        id: check
        shell: bash
        run: |
          if grep -q '"name": "@neotamia/monorepo-template"' package.json; then
            echo "needs_setup=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_setup=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize project files
        if: steps.check.outputs.needs_setup == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          LOW_OWNER=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')
          LOW_NAME=$(printf '%s' "$REPO_NAME" | tr '[:upper:]_' '[:lower:]-' | sed 's/[^a-z0-9-]/-/g; s/-\+/-/g; s/^-//; s/-$//')

          export PACKAGE_PREFIX="@$LOW_OWNER/$LOW_NAME"
          export REPOSITORY_PATH="$REPO_OWNER/$REPO_NAME"
          export IMAGE_REGISTRY="ghcr.io/$LOW_OWNER"
          export DISPLAY_NAME="$REPO_NAME"
          export PROJECT_NAME="$LOW_NAME"
          export PROJECT_AUTHOR="@$REPO_OWNER"

          echo "Setting up $REPOSITORY_PATH with package prefix $PACKAGE_PREFIX"

          while IFS= read -r -d '' file; do
            if [[ "$file" == ".github/workflows/project-setup.yaml" ]] || ! grep -Iq . "$file"; then
              continue
            fi

            perl -0pi -e '
              s{\@neotamia/monorepo-template}{$ENV{PACKAGE_PREFIX}}g;
              s{NeoTamia/monorepo-template}{$ENV{REPOSITORY_PATH}}g;
              s{ghcr\.io/neotamia}{$ENV{IMAGE_REGISTRY}}g;
              s{Monorepo Template}{$ENV{DISPLAY_NAME}}g;
              s{monorepo-template}{$ENV{PROJECT_NAME}}g;
              s{\@alwyn974}{$ENV{PROJECT_AUTHOR}}g;
            ' "$file"
          done < <(git ls-files -z)

      - name: Commit initialized project
        if: steps.check.outputs.needs_setup == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: project setup for ${{ github.event.repository.name }}"

      - name: Remove setup workflow
        if: steps.check.outputs.needs_setup == 'true' || github.event_name == 'workflow_dispatch'
        run: rm .github/workflows/project-setup.yaml

      - name: Commit workflow removal
        if: steps.check.outputs.needs_setup == 'true' || github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: remove project setup workflow"
