# Copied into generated repos. They pull this template with GITHUB_TOKEN.

source:
source_ref:
prefer_branch: dev

identity:
  extra:
    "@neotamia/monorepo-template": "@{owner_lower}/{kebab}"
    NeoTamia/monorepo-template: "{owner}/{kebab}"
    ghcr.io/neotamia: "ghcr.io/{owner_lower}"
    "@alwyn974": "@{owner}"
  owner_files:
    - README.md
    - CONTRIBUTING.md

overwrite:

merge_json:
  - package.json
  - apps/*/package.json
  - packages/*/package.json

three_way:
  - AGENTS.md
  - CODING_STANDARDS.md
  - .editorconfig
  - .oxlintrc.json
  - .oxfmtrc.json
  - .dockerignore
  - .gitignore
  - packages/config/oxlint/**
  - packages/config/tsconfig/**
  - deploy/README.md
  - deploy/production.env.example
  - .env.example
  - .github/renovate.json5
  - .github/ISSUE_TEMPLATE/**
  - .github/PULL_REQUEST_TEMPLATE.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lefthook.yml
  - commitlint.config.ts
  - turbo.json
  - Dockerfile
  - SECURITY.md
  - tsconfig.json
  - compose.yaml
  - compose.production.yaml

exclude:
  - .github/workflows/**
  - .github/template-sync.yml
  - .github/template-sync-state.json
  - apps/*/src/**
  - apps/*/app/**
  - packages/*/src/**
  - bun.lock
  - README.md
