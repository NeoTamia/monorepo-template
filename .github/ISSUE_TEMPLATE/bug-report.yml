name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["🐛 bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable set of steps or repository.
      placeholder: "1. Start…\n2. Run…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: Bun version
      placeholder: 1.4.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include OS, logs with secrets removed, screenshots or related links.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This report does not disclose a security vulnerability or secret.
          required: true
